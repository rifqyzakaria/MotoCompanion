name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist debug.keystore for continuous in-app updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-Sync-v1.5.0-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
          name: "H-Sync v1.5.0 (Language Selection & Dark/Light Theme Settings)"
          body: |
            ### 🏍️ H-Sync v1.5.0 (Pengaturan Bahasa & Pilihan Mode Gelap/Terang)

            Pembaruan terbaru H-Sync (Pendamping Cerdas Honda RoadSync untuk semua lini motor Honda):
            - 🌐 **Pengaturan Pilihan Bahasa (Language Selection)**: Mendukung penuh **Bahasa Indonesia** dan **English (Inggris)** atau mengikuti default perangkat. Seluruh teks antarmuka, dialog, status, hingga suara pengumuman TTS intercom otomatis menyesuaikan dengan bahasa yang dipilih!
            - 🌓 **Pengaturan Mode Tampilan (Theme Settings)**: Pengendara kini dapat memilih antara:
              - **Otomatis (Ikuti Sistem / Device)**: Otomatis berubah saat HP Anda beralih mode siang/malam.
              - **Mode Gelap (Dark Mode)**: Tampilan OLED kontras tinggi hemat baterai dan ramah di mata pengendara.
              - **Mode Terang (Light Mode)**: Tampilan bersih, cerah, dan berdaya baca tinggi di bawah terik sinar matahari.
            - 🏍️ **Kompatibilitas Penuh Seluruh Motor Honda RoadSync**: Bekerja mulus untuk seluruh tipe motor Honda berfitur RoadSync (PCX, ADV, Forza, Hornet, Transalp, CB, Rebel, dll.).
            - ⚡ **Auto-Start & Auto-Stop Cerdas**: Otomatis hidup saat motor tersambung dan mati total saat kontak motor mati.
            - 🎵 **Integrasi Layar TFT & Tombol Stang**: Menjaga sinkronisasi pemutar pihak ketiga (BitChord, YouTube Music, dll.) ke speedometer TFT.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
