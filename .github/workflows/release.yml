name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist debug.keystore for continuous in-app updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-Sync-v1.4.0-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: "H-Sync v1.4.0 (Auto-Lifecycle, Rebrand to H-Sync & New Minimalist UI)"
          body: |
            ### 🏍️ H-Sync v1.4.0 (Pembaruan Otomatisasi Motor Honda, Rebrand & Desain Baru)

            Pembaruan besar sistem pendamping cerdas Honda RoadSync:
            - ⚡ **Auto-Start & Auto-Stop Cerdas**: H-Sync otomatis aktif saat motor Honda dinyalakan / terhubung Bluetooth, dan otomatis **MATI TOTAL** saat motor dimatikan atau koneksi terputus. Tidak ada lagi proses yang tertinggal di latar belakang atau menguras baterai saat motor mati!
            - 🏷️ **Rebrand Menjadi 'H-Sync'**: Nama resmi dipersingkat menjadi H-Sync agar modern, elegan, dan mudah dikenali.
            - 🏍️ **Dukungan Seluruh Lini Motor Honda RoadSync**: Dirancang tidak hanya untuk PCX, tetapi juga seluruh lini motor Honda yang dilengkapi konektivitas RoadSync / HSVCS (ADV 160/350, Forza 250/350/750, X-ADV, CB650R, CB750 Hornet, XL750 Transalp, Rebel 1100, dll.).
            - 🎨 **Pembaruan Desain UI & UX Minimalis**: Desain antarmuka gelap modern, bersih, nyaman di mata, kontras tinggi saat berkendara siang hari, dan sangat mudah digunakan.
            - 🎵 **Sinergi Penuh Layar TFT Speedometer**: Menjaga integrasi sempurna dengan BitChord dan pemutar lainnya agar judul lagu dan kontrol stang berjalan instan tanpa pesan kesalahan.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
