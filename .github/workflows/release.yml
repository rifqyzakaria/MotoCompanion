name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist debug.keystore for continuous in-app updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.3.2-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.2' }}
          name: "MotoCompanion v1.3.2 (Definitive PCX TFT Meter & RoadSync Fix)"
          body: |
            ### 🏍️ MotoCompanion v1.3.2 (Solusi Tuntas Layar TFT Honda PCX & RoadSync)

            Pembaruan tuntas mengatasi pesan 'Kesalahan Aplikasi Musik' pada dashboard TFT speedometer Honda PCX:
            - 🔄 **Singleton MediaSession Token**: Semua alias service target RoadSync (`com.spotify.music.libs.mediabrowserservice`, `com.spotify.mediabrowserservice`, `com.spotify.mediabrowserservice.mediabrowserservice`) kini berbagi satu MediaSession yang sama.
            - 📡 **Siaran Broadcast Resmi Spotify**: Mengirimkan broadcast `com.spotify.music.playbackstatechanged` & `metadatachanged` yang dimonitor oleh Honda RoadSync (Drivemode).
            - 🛡️ **Hardware Audio Detection**: Menggunakan pendeteksi audio perangkat keras (`isMusicActive`) agar status musik tidak pernah salah terdeteksi mati saat BitChord memutar lagu.
            - 🔔 **MediaStyle Foreground Notification**: Menjaga notifikasi kontrol musik aktif di status bar sehingga RoadSync tidak memutus koneksi.
            - 🔑 **Tanda Tangan Kunci Permanen**: Sudah ditandatangani menggunakan keystore permanen yang tersimpan di repositori untuk update mulus seterusnya.
            - ⚡ **Respon Cepat Tombol Stang PCX**: Menangani callback `onPrepare`, `onPrepareFromMediaId`, dan `onPlay` dengan transisi instan ke status `STATE_PLAYING` dan meneruskannya ke BitChord tanpa timeout.
            - 🛡️ **Anti Session Conflict**: Memperbaiki deteksi media controller agar tidak membaca paket sendiri.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
