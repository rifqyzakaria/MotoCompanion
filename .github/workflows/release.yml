name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.3.0-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.3.0
          name: "MotoCompanion v1.3.0 (Spotify Integration for Honda RoadSync)"
          body: |
            ### 🏍️ MotoCompanion v1.3.0 (Integrasi Menu Sumber Musik Honda RoadSync)

            Pembaruan khusus penyamaran paket resmi untuk Honda RoadSync:
            - 🎵 **Muncul di Menu "Sumber Musik" Honda RoadSync**: Menggunakan `applicationId = com.spotify.music` sehingga langsung dikenali dan dipilih di menu Sumber Musik RoadSync.
            - 🎮 **Rute Tombol Stang PCX ke BitChord**: Saat dipilih di RoadSync, seluruh tombol stang (Next, Prev, Play, Pause) diteruskan langsung ke pemutar musik aktif Anda (BitChord/lainnya).
            - 📟 **Judul Lagu di Layar TFT Speedometer**: Mengirimkan judul lagu dan artis yang sedang diputar di BitChord langsung ke speedometer Honda PCX via protokol RoadSync MediaSession.
            - 🔄 **Auto-Active & WhatsApp Announcer**: Tetap mempertahankan fitur otomatis aktif dan pembaca pesan/telepon WhatsApp hanya saat berkendara.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
