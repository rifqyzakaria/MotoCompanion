name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.3.1-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.1' }}
          name: "MotoCompanion v1.3.1 (Fixed PCX TFT Meter & RoadSync Playback Sync)"
          body: |
            ### 🏍️ MotoCompanion v1.3.1 (Perbaikan Layar TFT Honda PCX & Sinkronisasi RoadSync)

            Pembaruan khusus mengatasi tampilan 'Kesalahan Aplikasi Musik' pada dashboard TFT speedometer Honda PCX:
            - 📟 **Mengatasi 'Kesalahan Aplikasi Musik' di Layar TFT PCX**: Menginisialisasi PlaybackState dan MediaMetadata secara instan saat RoadSync terhubung, sehingga TFT speedometer tidak lagi menampilkan peringatan seru (!) dan kesalahan aplikasi musik.
            - 🎵 **Sinkronisasi Real-Time Judul & Artis BitChord**: Menambahkan continuous sync loop yang menyalin judul lagu dan nama penyanyi yang sedang aktif diputar di BitChord langsung ke MediaSession RoadSync, sehingga nama lagu langsung tampil di speedometer PCX.
            - ⚡ **Respon Cepat Tombol Stang PCX**: Menangani callback `onPrepare`, `onPrepareFromMediaId`, dan `onPlay` dengan transisi instan ke status `STATE_PLAYING` dan meneruskannya ke BitChord tanpa timeout.
            - 🛡️ **Anti Session Conflict**: Memperbaiki deteksi media controller agar tidak membaca paket sendiri.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
