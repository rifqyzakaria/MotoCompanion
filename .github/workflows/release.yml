name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist debug.keystore for continuous in-app updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-Sync-v1.7.1-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.7.1' }}
          name: "H-Sync v1.7.1 (Smooth RoadSync Maps Navigation Fix, Cooperative Live GPS & WhatsApp Caller Name Fix)"
          body: |
            ## Changelog
            - **Smooth RoadSync Maps & Headunit Navigation Fix**: Removed 2.4GHz `WifiLock` BLE contention, GNSS reset commands, and notification binder loop so Honda RoadSync opens Maps and streams Turn-by-Turn directions smoothly without interruption.
            - **Cooperative Live GPS**: Uses a clean, shared `FusedLocationProviderClient` (`1000ms` high-accuracy stream) alongside RoadSync and Google Maps with zero hardware resets.
            - **WhatsApp Call & Message Fix**: Restored full Android 12–14 `CallStyle` incoming WhatsApp call detection offloaded to a background thread, reading saved Contact Names (never phone numbers), plus automatic RoadSync Notification Access health diagnostics on the dashboard.

            ## Install
            **Android** (8.0 / API 26+): installs straight over v1.7.0 via `MotoCompanion.apk` by `rifqyzakaria`.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
