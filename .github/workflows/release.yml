name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist debug.keystore for continuous in-app updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-Sync-v1.5.1-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.1' }}
          name: "H-Sync v1.5.1 (Music Player Toggle & Official @mrz92 Source)"
          body: |
            ### 🏍️ H-Sync v1.5.1 (Official Update by @mrz92)

            Pembaruan terbaru H-Sync (Pendamping Cerdas Honda RoadSync untuk semua lini motor Honda):
            - 🎵 **Sakelar Pemutar Musik H-Sync (Music Player Switch)**:
              - **Aktif (ON)**: H-Sync bertindak sebagai jembatan Spotify virtual ke pemutar pihak ketiga (BitChord, dll.) untuk ditampilkan di TFT Honda PCX / ADV.
              - **Nonaktif (OFF)**: RoadSync dapat langsung memilih dan menghubungkan pemutar resmi ter-whitelist (Spotify resmi, YouTube Music, Samsung Music, VLC, dll.) tanpa bentrok, sementara fitur pengumuman WA dan GPS H-Sync tetap aktif.
            - 🛡️ **Kredit Pembuat Resmi (@mrz92) & Proteksi Pembaruan**:
              - Dikembangkan dan ditandatangani resmi oleh **@mrz92**.
              - Sistem pembaruan aplikasi otomatis terkunci khusus ke repositori resmi GitHub `@mrz92` (`rifqyzakaria/MotoCompanion`), mencegah modifikasi dan menjaga keamanan penuh aplikasi.
            - 📐 **Format Teks & Panduan Simetris (UI Symmetrical Polish)**:
              - Tampilan panduan motor (Bike Guide), dialog pembaruan GitHub, dan status kartu kini tertata simetris, rapi, dan konsisten dalam Bahasa Indonesia dan English.
            - 🌐 **Dukungan Multi-Bahasa & Mode Gelap/Terang**:
              - Pengaturan Bahasa Indonesia & Inggris serta tema Gelap/Terang/Otomatis.
            - ⚡ **Auto-Start & Auto-Stop Cerdas**:
              - Otomatis hidup saat motor tersambung dan mati total saat kontak motor mati.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
