name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.2.1-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.2.1
          name: "MotoCompanion v1.2.1 (Automotive & RoadSync Media Integration)"
          body: |
            ### 🏍️ MotoCompanion v1.2.1 (Integrasi Media Honda PCX & RoadSync)

            Pembaruan kompatibilitas media untuk Honda RoadSync dan Android Auto:
            - 🚗 **Android Automotive & MediaBrowser XML**: Menambahkan deskriptor resmi `automotive_app_desc.xml` dan meta-data `com.google.android.gms.car.application` agar dikenali oleh sistem dashboard motor dan mobil.
            - 🎵 **Extended Media Intents**: Mendukung `MUSIC_PLAYER`, `APP_MUSIC`, `VIEW audio/*`, dan `MediaBrowserServiceCompat`.
            - 🎮 **Kontrol Tombol Stang Honda PCX & Intercom**: Meneruskan tombol navigasi stang dan intercom langsung ke pemutar musik aktif.
            - 📻 **Sinkronisasi Judul Lagu ke Speedometer**: Judul lagu dan nama artis dari aplikasi pihak ketiga dikirim ke MediaSession RoadSync agar muncul di layar speedometer PCX.
            - 🚀 **Auto-Wake Engine**: Membangunkan pemutar musik secara otomatis saat tombol Play ditekan jika pemutar sedang tertidur.
            - 🎛️ **Card Status Pendamping di Dashboard**: Menampilkan status koneksi RoadSync, Bluetooth motor, tombol Buka RoadSync, dan panduan 1-menit.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
