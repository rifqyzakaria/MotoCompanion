name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist debug.keystore for continuous in-app updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-Sync-v1.6.0-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.0' }}
          name: "H-Sync v1.6.0 (Motion Compass HUD, Android Auto Separation & Elegant UI by rifqyzakaria)"
          body: |
            ### 🏍️ H-Sync v1.6.0 (Official Release by rifqyzakaria)

            Pembaruan terbaru H-Sync (Pendamping Cerdas Honda RoadSync untuk semua lini motor Honda):
            - 🧭 **Mode HUD Baru & Kompas Sensor Gerak HP**:
              - Kompas kini responsif mengikuti putaran dan orientasi fisik HP secara *real-time* saat dipegang atau dipasang di stang.
              - Transisi sudut kompas yang halus (*smooth dampening*) dengan perpaduan sensor orientasi HP dan vektor GPS berkecepatan tinggi.
            - 🎵 **Pembaruan Media Player HUD (Visible & Easy to Control)**:
              - Bilah pemutar media kini tampil menonjol di bagian bawah layar HUD dengan judul lagu, artis, serta tombol sentuh besar ramah sarung tangan (*tactile buttons*).
            - 🚗 **Pemisahan Cerdas Android Auto (Car Mode Separation)**:
              - H-Sync secara otomatis mendeteksi saat HP terhubung ke **Android Auto** di mobil dan otomatis *standby/pause*, sehingga tidak akan mengganggu sistem infotainment mobil Anda. H-Sync hanya aktif saat berkendara motor Honda / RoadSync!
            - 🔄 **Pengecekan Pembaruan Otomatis**:
              - Aplikasi secara otomatis memeriksa ketersediaan pembaruan resmi di GitHub saat pertama kali dibuka.
            - ✨ **Desain UI/UX Minimalis & Fluid**:
              - Tata letak antarmuka dirampingkan, animasi layout halus (*fluid animation*), dan kredit pembuat elegan **rifqyzakaria**.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
