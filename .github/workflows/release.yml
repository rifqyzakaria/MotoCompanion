name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.1.0-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.1.0
          name: "MotoCompanion v1.1.0 (Release)"
          body: |
            ### 🏍️ MotoCompanion v1.1.0

            Pembaruan otomatis terbaru untuk MotoCompanion:
            - 🎵 **Multi-Tier Media Player Control**: Kontrol penuh pemutar audio & video pihak ketiga (Spotify, YouTube Music, VLC, Poweramp, YouTube ReVanced, dll.).
            - 🏍️ **Integrasi Tombol Stang Honda RoadSync & Intercom**: Tombol Play, Pause, Next, Prev dari stang motor dan intercom helm Bluetooth diteruskan langsung ke pemutar musik yang sedang dipilih.
            - 📻 **Sinkronisasi Info Lagu**: Judul lagu dan nama artis dari aplikasi pihak ketiga disinkronkan langsung ke MediaSession agar tampil di kluster speedometer dan notifikasi.
            - 🚀 **Auto-Wake Engine**: Membangunkan pemutar musik secara otomatis saat tombol Play ditekan jika pemutar sedang tertidur.
            - 🎛️ **Dashboard Quick Control**: Tombol kontrol cepat (Prev, Play/Pause, Next) dan live track info di dashboard utama dan speedometer HUD.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
