name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.2.0-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.2.0
          name: "MotoCompanion v1.2.0 (Honda PCX & RoadSync Companion)"
          body: |
            ### 🏍️ MotoCompanion v1.2.0 (Integrasi Honda PCX & RoadSync)

            Pembaruan besar integrasi resmi untuk Honda PCX dan Honda RoadSync:
            - 🏍️ **Integrasi Penuh Honda RoadSync (HSVCS)**: MotoCompanion kini terdaftar resmi sebagai penyedia musik (`MediaBrowserService` & `APP_MUSIC`) di menu Sumber Musik Honda RoadSync.
            - 🎮 **Kontrol Tombol Stang Honda PCX**: Tombol navigasi stang motor Honda PCX (Play, Pause, Next, Prev) di menu musik RoadSync langsung mengendalikan Spotify, YouTube Music, VLC, dll.
            - 📡 **Bluetooth Auto-Start**: Mendeteksi otomatis koneksi Bluetooth motor Honda PCX / helm intercom dan menyalakan mode pendamping tanpa perlu buka aplikasi manual.
            - 📻 **Sinkronisasi Judul Lagu ke Speedometer**: Judul lagu dan nama artis dari aplikasi pihak ketiga dikirim ke MediaSession RoadSync agar muncul di layar speedometer PCX.
            - 🚀 **Auto-Wake Engine**: Membangunkan pemutar musik secara otomatis saat tombol Play ditekan jika pemutar sedang tertidur.
            - 🎛️ **Card Status Pendamping di Dashboard**: Menampilkan status koneksi RoadSync, Bluetooth motor, tombol Buka RoadSync, dan panduan 1-menit.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
