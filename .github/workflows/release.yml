name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release MotoCompanion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Persistent Signing Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/MotoCompanion.apk
          cp release_assets/MotoCompanion.apk ./MotoCompanion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCompanion-v1.2.2-APK
          path: release_assets/MotoCompanion.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.2.2
          name: "MotoCompanion v1.2.2 (Smart RoadSync Auto-Sync & WhatsApp Voice Announcer)"
          body: |
            ### 🏍️ MotoCompanion v1.2.2 (Sinkronisasi Otomatis Honda RoadSync & WhatsApp)

            Pembaruan khusus pendamping resmi Honda RoadSync & Honda PCX:
            - 🔄 **Auto-Active saat RoadSync Dibuka**: MotoCompanion otomatis aktif mendampingi ketika Honda RoadSync dibuka / notifikasi RoadSync berjalan di latar belakang.
            - 🔇 **Filter Pintar WhatsApp**: MotoCompanion HANYA membacakan pesan dan panggilan suara/video WhatsApp saat Honda RoadSync sedang aktif berkendara (tidak akan mengumumkan pesan saat di rumah atau motor mati).
            - 🏍️ **PCX TFT & BitChord Ready**: Bekerja harmonis dengan layar TFT Honda PCX dan BitChord tanpa bentrok audio.
            - 🔑 **Consistent Keystore Signing**: Update in-app berikutnya dijamin 100% mulus dengan tanda tangan kunci yang seragam.
          files: release_assets/MotoCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
